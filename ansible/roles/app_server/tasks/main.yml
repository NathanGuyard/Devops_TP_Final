---
# Rôle App Server pour Alpine Linux
- name: Installation de Python et dépendances
  apk:
    name:
      - python3
      - py3-pip
      - py3-psycopg2
      - py3-gunicorn
    state: present

- name: Création de l'utilisateur application
  user:
    name: appuser
    shell: /bin/sh
    create_home: yes
    system: yes

- name: Création du répertoire de l'application
  file:
    path: /opt/app
    state: directory
    owner: appuser
    group: appuser
    mode: '0755'

- name: Création du répertoire des logs
  file:
    path: /var/log/app
    state: directory
    owner: appuser
    group: appuser
    mode: '0755'

- name: Installation des dépendances Python
  pip:
    name:
      - flask
      - flask-cors
      - gunicorn
      - psycopg2-binary
      - python-dotenv
      - requests
    executable: pip3
    extra_args: --break-system-packages

- name: Copie du code de l'application
  copy:
    src: "{{ playbook_dir }}/../app/backend/"
    dest: /opt/app/
    owner: appuser
    group: appuser
    mode: '0644'
    directory_mode: '0755'

- name: Configuration du fichier .env
  template:
    src: env.j2
    dest: /opt/app/.env
    owner: appuser
    group: appuser
    mode: '0600'

- name: Création du script de démarrage OpenRC
  template:
    src: app.openrc.j2
    dest: /etc/init.d/app
    mode: '0755'
  notify: Restart App

- name: Autoriser le port de l'application dans iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ app_port }}"
    jump: ACCEPT

- name: Activation du service au démarrage
  command: rc-update add app default
  changed_when: false

- name: Démarrage du service
  service:
    name: app
    state: started
