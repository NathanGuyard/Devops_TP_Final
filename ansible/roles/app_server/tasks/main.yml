---
- name: Installation de Python et dépendances
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
      - libpq-dev
    state: present

- name: Création de l'utilisateur application
  user:
    name: appuser
    shell: /bin/bash
    create_home: yes
    system: yes

- name: Création du répertoire de l'application
  file:
    path: /opt/app
    state: directory
    owner: appuser
    group: appuser
    mode: '0755'

- name: Création du répertoire des logs
  file:
    path: /var/log/app
    state: directory
    owner: appuser
    group: appuser
    mode: '0755'

- name: Création de l'environnement virtuel Python
  command: python3 -m venv /opt/app/venv
  args:
    creates: /opt/app/venv
  become_user: appuser

- name: Copie du code de l'application
  synchronize:
    src: "{{ playbook_dir }}/../app/backend/"
    dest: /opt/app/
    delete: no
    recursive: yes
  delegate_to: "{{ inventory_hostname }}"
  become: yes

- name: Installation des dépendances Python
  pip:
    requirements: /opt/app/requirements.txt
    virtualenv: /opt/app/venv
  become_user: appuser

- name: Configuration du fichier .env
  template:
    src: env.j2
    dest: /opt/app/.env
    owner: appuser
    group: appuser
    mode: '0600'

- name: Configuration du service systemd
  template:
    src: app.service.j2
    dest: /etc/systemd/system/app.service
    mode: '0644'
  notify: Restart App

- name: Rechargement de systemd
  systemd:
    daemon_reload: yes

- name: Autoriser le port de l'application dans le firewall
  ufw:
    rule: allow
    port: "{{ app_port }}"
    proto: tcp

- name: Démarrage et activation du service
  service:
    name: app
    state: started
    enabled: yes
