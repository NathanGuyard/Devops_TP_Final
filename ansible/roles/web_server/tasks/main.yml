---
# Rôle Web Server pour Alpine Linux
- name: Installation de Nginx
  apk:
    name:
      - nginx
      - openssl
    state: present

- name: Création du répertoire SSL
  file:
    path: /etc/nginx/ssl
    state: directory
    mode: '0755'

- name: Génération du certificat SSL auto-signé
  command: >
    openssl req -x509 -nodes -days 365 -newkey rsa:2048
    -keyout /etc/nginx/ssl/nginx.key
    -out /etc/nginx/ssl/nginx.crt
    -subj "/C=FR/ST=Paris/L=Paris/O=DevOps/CN={{ inventory_hostname }}"
  args:
    creates: /etc/nginx/ssl/nginx.crt

- name: Création du répertoire web
  file:
    path: /var/www/html
    state: directory
    owner: nginx
    group: nginx
    mode: '0755'

- name: Création du répertoire pour les assets statiques
  file:
    path: /var/www/html/static
    state: directory
    owner: nginx
    group: nginx
    mode: '0755'

- name: Configuration Nginx Web Server
  template:
    src: nginx-web.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  notify: Restart Nginx

- name: Création du répertoire conf.d
  file:
    path: /etc/nginx/conf.d
    state: directory
    mode: '0755'

- name: Configuration du site Web
  template:
    src: web-site.conf.j2
    dest: /etc/nginx/conf.d/webapp.conf
    mode: '0644'
  notify: Restart Nginx

- name: Déploiement du contenu statique (frontend)
  copy:
    src: "{{ playbook_dir }}/../app/frontend/"
    dest: /var/www/html/
    owner: nginx
    group: nginx
    mode: '0644'
    directory_mode: '0755'

- name: Autoriser HTTP dans iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 80
    jump: ACCEPT

- name: Activation de Nginx au démarrage
  command: rc-update add nginx default
  changed_when: false

- name: Démarrage de Nginx
  service:
    name: nginx
    state: started
