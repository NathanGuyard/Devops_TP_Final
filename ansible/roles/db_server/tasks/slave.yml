---
# Configuration Slave PostgreSQL pour Alpine Linux
- name: Arrêt de PostgreSQL sur le slave
  service:
    name: postgresql
    state: stopped
  ignore_errors: yes

- name: Suppression des données existantes
  file:
    path: /var/lib/postgresql/data
    state: absent

- name: Création du répertoire de données
  file:
    path: /var/lib/postgresql/data
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Base backup depuis le master
  become_user: postgres
  command: >
    pg_basebackup -h {{ db_master_ip }} -D /var/lib/postgresql/data
    -U {{ replication_user }} -v -P --wal-method=stream -R
  environment:
    PGPASSWORD: "{{ replication_password }}"

- name: Configuration PostgreSQL Slave
  template:
    src: postgresql-slave.conf.j2
    dest: /var/lib/postgresql/data/postgresql.conf
    owner: postgres
    group: postgres
    mode: '0644'

- name: Création du fichier standby.signal
  file:
    path: /var/lib/postgresql/data/standby.signal
    state: touch
    owner: postgres
    group: postgres
    mode: '0600'

- name: Configuration pg_hba.conf slave
  template:
    src: pg_hba-slave.conf.j2
    dest: /var/lib/postgresql/data/pg_hba.conf
    owner: postgres
    group: postgres
    mode: '0640'

- name: Démarrage de PostgreSQL Slave
  service:
    name: postgresql
    state: started
