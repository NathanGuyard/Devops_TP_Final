---
# Rôle DB Server pour Alpine Linux
- name: Installation de PostgreSQL et dépendances
  apk:
    name:
      - postgresql15
      - postgresql15-contrib
      - postgresql15-client
      - py3-psycopg2
    state: present

- name: Création du répertoire de données PostgreSQL
  file:
    path: /var/lib/postgresql/data
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Création du répertoire pour les backups
  file:
    path: /var/backups/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'

- name: Création du répertoire pour les archives WAL
  file:
    path: /var/lib/postgresql/wal_archive
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'

- name: Création du répertoire des logs
  file:
    path: /var/log/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'

- name: Initialisation de la base de données (si nécessaire)
  become_user: postgres
  command: initdb -D /var/lib/postgresql/data
  args:
    creates: /var/lib/postgresql/data/PG_VERSION
  when: role == 'master'

- name: Configuration Master
  include_tasks: master.yml
  when: role == 'master'

- name: Configuration Slave
  include_tasks: slave.yml
  when: role == 'slave'

- name: Autoriser PostgreSQL dans iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ db_port }}"
    jump: ACCEPT

- name: Activation du service au démarrage
  command: rc-update add postgresql default
  changed_when: false

- name: Démarrage de PostgreSQL
  service:
    name: postgresql
    state: started
