---
# Rôle Load Balancer pour Alpine Linux
- name: Installation de Nginx
  apk:
    name:
      - nginx
      - openssl
    state: present

- name: Création du répertoire SSL
  file:
    path: /etc/nginx/ssl
    state: directory
    mode: '0755'

- name: Génération du certificat SSL auto-signé
  command: >
    openssl req -x509 -nodes -days 365 -newkey rsa:2048
    -keyout /etc/nginx/ssl/nginx.key
    -out /etc/nginx/ssl/nginx.crt
    -subj "/C=FR/ST=Paris/L=Paris/O=DevOps/CN={{ app_domain }}"
  args:
    creates: /etc/nginx/ssl/nginx.crt

- name: Configuration Nginx Load Balancer
  template:
    src: nginx-lb.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  notify: Restart Nginx

- name: Création du répertoire conf.d
  file:
    path: /etc/nginx/conf.d
    state: directory
    mode: '0755'

- name: Configuration du site Load Balancer
  template:
    src: lb-site.conf.j2
    dest: /etc/nginx/conf.d/load-balancer.conf
    mode: '0644'
  notify: Restart Nginx

- name: Autoriser HTTP dans iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 80
    jump: ACCEPT

- name: Autoriser HTTPS dans iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 443
    jump: ACCEPT

- name: Activation de Nginx au démarrage
  command: rc-update add nginx default
  changed_when: false

- name: Démarrage de Nginx
  service:
    name: nginx
    state: started
