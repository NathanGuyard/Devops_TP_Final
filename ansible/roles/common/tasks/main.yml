---
# Rôle common adapté pour Alpine Linux
- name: Mise à jour du cache apk
  apk:
    update_cache: yes

- name: Installation des packages de base
  apk:
    name:
      - curl
      - wget
      - vim
      - htop
      - bash
      - ca-certificates
      - iptables
    state: present

- name: Configuration du hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Mise à jour de /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.name }}"
    state: present
  loop:
    - { ip: "{{ lb_ip }}", name: "lb-01" }
    - { ip: "{{ web_servers[0].ip }}", name: "web-01" }
    - { ip: "{{ web_servers[1].ip }}", name: "web-02" }
    - { ip: "{{ app_servers[0].ip }}", name: "app-01" }
    - { ip: "{{ app_servers[1].ip }}", name: "app-02" }
    - { ip: "{{ db_master_ip }}", name: "db-master" }
    - { ip: "{{ db_slave_ip }}", name: "db-slave" }

- name: Configuration du timezone
  copy:
    content: "Europe/Paris"
    dest: /etc/timezone
  notify: Update timezone

- name: Autoriser SSH via iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 22
    jump: ACCEPT
    state: present
