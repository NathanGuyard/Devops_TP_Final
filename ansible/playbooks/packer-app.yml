---
- name: Configuration de base pour image App Server (Alpine)
  hosts: all
  become: yes
  vars:
    image_type: app

  tasks:
    - name: Mise à jour des packages
      apk:
        update_cache: yes
        upgrade: yes

    - name: Installation de Python et dépendances
      apk:
        name:
          - python3
          - py3-pip
          - py3-virtualenv
          - py3-psycopg2
          - gcc
          - musl-dev
          - python3-dev
          - libffi-dev
        state: present

    - name: Création de l'utilisateur application
      user:
        name: appuser
        shell: /bin/sh
        create_home: yes
        system: yes

    - name: Création du répertoire de l'application
      file:
        path: /opt/app
        state: directory
        owner: appuser
        group: appuser
        mode: '0755'

    - name: Création du répertoire des logs
      file:
        path: /var/log/app
        state: directory
        owner: appuser
        group: appuser
        mode: '0755'

    - name: Installation des packages Python de base
      pip:
        name:
          - flask
          - gunicorn
          - psycopg2-binary
          - python-dotenv
          - flask-cors
          - requests
        executable: pip3

    - name: Création du script de démarrage OpenRC
      copy:
        dest: /etc/init.d/app
        content: |
          #!/sbin/openrc-run

          name="Flask Application"
          description="Python Flask API Server"

          command="/usr/bin/gunicorn"
          command_args="--workers 2 --bind 0.0.0.0:3000 --chdir /opt/app app:app"
          command_user="appuser"
          command_background="yes"
          pidfile="/run/${RC_SVCNAME}.pid"

          depend() {
              need net
              after firewall
          }
        mode: '0755'

    - name: Activation du service au démarrage
      command: rc-update add app default
