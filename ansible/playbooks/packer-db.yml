---
- name: Configuration de base pour image Database Server
  hosts: all
  become: yes
  vars:
    image_type: db
    postgresql_version: "15"

  tasks:
    - name: Mise à jour du système
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Installation des dépendances
      apt:
        name:
          - gnupg2
          - wget
          - lsb-release
        state: present

    - name: Ajout de la clé GPG PostgreSQL
      apt_key:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        state: present

    - name: Ajout du repository PostgreSQL
      apt_repository:
        repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
        state: present
        filename: pgdg

    - name: Installation de PostgreSQL
      apt:
        name:
          - "postgresql-{{ postgresql_version }}"
          - "postgresql-contrib-{{ postgresql_version }}"
          - "postgresql-client-{{ postgresql_version }}"
        state: present
        update_cache: yes

    - name: Création du répertoire pour les backups
      file:
        path: /var/backups/postgresql
        state: directory
        owner: postgres
        group: postgres
        mode: '0750'

    - name: Création du répertoire pour les archives WAL
      file:
        path: /var/lib/postgresql/wal_archive
        state: directory
        owner: postgres
        group: postgres
        mode: '0750'

    - name: Configuration PostgreSQL optimisée
      copy:
        dest: "/etc/postgresql/{{ postgresql_version }}/main/conf.d/custom.conf"
        content: |
          # Performance
          shared_buffers = 1GB
          effective_cache_size = 3GB
          maintenance_work_mem = 256MB
          work_mem = 64MB

          # WAL et Réplication
          wal_level = replica
          max_wal_senders = 5
          wal_keep_size = 1GB
          hot_standby = on

          # Archivage
          archive_mode = on
          archive_command = 'cp %p /var/lib/postgresql/wal_archive/%f'

          # Logging
          logging_collector = on
          log_directory = 'log'
          log_filename = 'postgresql-%Y-%m-%d.log'
          log_rotation_age = 1d
          log_rotation_size = 100MB
          log_min_duration_statement = 1000
        owner: postgres
        group: postgres
        mode: '0644'

    - name: Script de backup automatique
      copy:
        dest: /usr/local/bin/pg_backup.sh
        content: |
          #!/bin/bash
          BACKUP_DIR="/var/backups/postgresql"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          pg_dumpall -U postgres | gzip > "${BACKUP_DIR}/full_backup_${TIMESTAMP}.sql.gz"

          # Garder les 7 derniers backups
          find ${BACKUP_DIR} -name "full_backup_*.sql.gz" -mtime +7 -delete
        mode: '0755'

    - name: Cron pour backup quotidien
      cron:
        name: "PostgreSQL daily backup"
        minute: "0"
        hour: "2"
        job: "/usr/local/bin/pg_backup.sh"
        user: postgres

    - name: Arrêt de PostgreSQL pour l'image
      service:
        name: postgresql
        state: stopped
        enabled: yes
