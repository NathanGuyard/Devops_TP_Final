---
- name: Configuration de base pour image Database Server (Alpine)
  hosts: all
  become: yes
  vars:
    image_type: db
    postgresql_version: "15"

  tasks:
    - name: Mise à jour des packages
      apk:
        update_cache: yes
        upgrade: yes

    - name: Installation de PostgreSQL
      apk:
        name:
          - postgresql{{ postgresql_version }}
          - postgresql{{ postgresql_version }}-contrib
          - postgresql{{ postgresql_version }}-client
        state: present

    - name: Création du répertoire pour les backups
      file:
        path: /var/backups/postgresql
        state: directory
        owner: postgres
        group: postgres
        mode: '0750'

    - name: Création du répertoire pour les archives WAL
      file:
        path: /var/lib/postgresql/wal_archive
        state: directory
        owner: postgres
        group: postgres
        mode: '0750'

    - name: Script de backup automatique
      copy:
        dest: /usr/local/bin/pg_backup.sh
        content: |
          #!/bin/sh
          BACKUP_DIR="/var/backups/postgresql"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          pg_dumpall -U postgres | gzip > "${BACKUP_DIR}/full_backup_${TIMESTAMP}.sql.gz"

          # Garder les 7 derniers backups
          find ${BACKUP_DIR} -name "full_backup_*.sql.gz" -mtime +7 -delete
        mode: '0755'

    - name: Activation de PostgreSQL au démarrage
      command: rc-update add postgresql default

    - name: Arrêt de PostgreSQL pour l'image
      service:
        name: postgresql
        state: stopped
