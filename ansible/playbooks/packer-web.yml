---
- name: Configuration de base pour image Web Server (Alpine)
  hosts: all
  become: yes
  vars:
    image_type: web

  tasks:
    - name: Mise à jour des packages
      apk:
        update_cache: yes
        upgrade: yes

    - name: Installation de Nginx
      apk:
        name:
          - nginx
          - openssl
          - ca-certificates
        state: present

    - name: Création du répertoire pour les certificats SSL
      file:
        path: /etc/nginx/ssl
        state: directory
        mode: '0755'

    - name: Génération d'un certificat SSL auto-signé
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/nginx/ssl/nginx.key
        -out /etc/nginx/ssl/nginx.crt
        -subj "/C=FR/ST=Paris/L=Paris/O=DevOps/CN=localhost"
      args:
        creates: /etc/nginx/ssl/nginx.crt

    - name: Création du répertoire web
      file:
        path: /var/www/html
        state: directory
        owner: nginx
        group: nginx
        mode: '0755'

    - name: Activation de Nginx au démarrage
      command: rc-update add nginx default

    - name: Arrêt de Nginx pour l'image
      service:
        name: nginx
        state: stopped
