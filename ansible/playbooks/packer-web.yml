---
- name: Configuration de base pour image Web Server
  hosts: all
  become: yes
  vars:
    image_type: web

  tasks:
    - name: Mise à jour du système
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Installation de Nginx
      apt:
        name:
          - nginx
          - nginx-extras
        state: present

    - name: Installation des outils SSL
      apt:
        name:
          - openssl
          - ca-certificates
        state: present

    - name: Création du répertoire pour les certificats SSL
      file:
        path: /etc/nginx/ssl
        state: directory
        mode: '0755'

    - name: Génération d'un certificat SSL auto-signé
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/nginx/ssl/nginx.key
        -out /etc/nginx/ssl/nginx.crt
        -subj "/C=FR/ST=Paris/L=Paris/O=DevOps/CN=localhost"
      args:
        creates: /etc/nginx/ssl/nginx.crt

    - name: Configuration Nginx optimisée
      copy:
        dest: /etc/nginx/nginx.conf
        content: |
          user www-data;
          worker_processes auto;
          pid /run/nginx.pid;
          include /etc/nginx/modules-enabled/*.conf;

          events {
              worker_connections 1024;
              use epoll;
              multi_accept on;
          }

          http {
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;
              types_hash_max_size 2048;
              server_tokens off;

              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              # Logging
              access_log /var/log/nginx/access.log;
              error_log /var/log/nginx/error.log;

              # Gzip
              gzip on;
              gzip_vary on;
              gzip_proxied any;
              gzip_comp_level 6;
              gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

              include /etc/nginx/conf.d/*.conf;
              include /etc/nginx/sites-enabled/*;
          }
        mode: '0644'

    - name: Désactivation du site par défaut
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Création du répertoire web
      file:
        path: /var/www/html
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Arrêt de Nginx pour l'image
      service:
        name: nginx
        state: stopped
        enabled: yes
